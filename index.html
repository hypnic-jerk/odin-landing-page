<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Landing Page</title>
</head>
<body>
  <div class="block-top">
    <div class="header">
      <img>
      <ul>
        <li>
          <a>link one</a>
        </li>
        <li>
          <a>link two</a>
        </li>
        <li>

        </li>
      </ul>
    </div>

    <div class="intro">

      </div>

  <div class="block-middle">

      <div class="item">

      <div class="item">
        <img>

      <div class="item">

    </div>

    <div class="block-middle">
      <p id="quote">This is a cool quote.</p>
      <p id="author">This is the person who wrote it</p>
    </div>

    <div class="block-middle">
      <div class="card">
        <div class="call-text">
          <p><strong>Call to action heading</strong></p>
          <p>This is some subtitle</p>
        </div>
        <div class="sign-up">
          <button>Sign up</button>
        </div>

    </div>

    <div class="footer">
      <p>footer text</p>
    </div>

</html>
